<html lang="en">
<head>
<meta charset="utf-8">

<title>The Killer Isn't Alice — Case Board</title>
<style>
:root{
  --pink:#c0488f;
  --pink-dark:#a93678;
  --cream:#eadbbc;
  --paper:#f7e0be;
  --blue:#7987b6;
  --yellow:#f2df00;
  --ink:#191a15;
  --muted:#5c554b;
  --line:#c9b58e;
  --green:#4e956a;
  --green-soft:#e8f2e9;
  --white:#fffaf0;
  --shadow:7px 8px 0 rgba(25,26,21,.16),0 14px 24px rgba(25,26,21,.12)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:18px}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{min-height:100dvh;background:var(--pink)}
.top{position:sticky;top:0;z-index:30;background:#eadbbc!important;background-color:#eadbbc!important;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 rgba(25,26,21,.14);padding-top:env(safe-area-inset-top);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;isolation:isolate;transform:translateZ(0)}
.bar{max-width:1180px;margin:auto;padding:30px 16px 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:54px;height:54px;display:grid;place-items:center;background:var(--pink);color:var(--cream);font-weight:1000;font-size:17px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--blue);border:2px solid var(--ink);flex:0 0 auto}
.brand b{font-size:31px;line-height:.96;display:block;letter-spacing:-.04em}
.brand small{font-size:16px;font-weight:850;color:var(--pink-dark);display:block;margin-top:3px}
.solver-chip{background:var(--blue);color:#fff;padding:7px 11px;border:2px solid var(--ink);font-weight:950;white-space:nowrap;transform:rotate(.8deg)}
nav{max-width:1180px;margin:auto;padding:0 12px 11px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:4px;padding:10px 14px;white-space:nowrap;font-weight:950;font-size:18px;min-height:48px}
nav button.on{background:var(--pink);color:#fff;border-color:var(--ink)}
main{max-width:1180px;margin:auto;padding:18px 16px 34px}
h1,h2,h3{font-weight:1000;letter-spacing:-.045em}
h1{font-size:48px;line-height:.92;margin:0 0 10px}
h2{font-size:31px;margin:8px 0 12px}
h3{font-size:21px;margin:10px 0 7px}
.sub{color:var(--muted);font-size:17px;line-height:1.4;margin:0 0 18px}
.card{background:var(--paper);border:3px solid var(--ink);padding:18px;box-shadow:var(--shadow)}
.btn{border:2px solid var(--ink);background:var(--white);color:var(--ink);border-radius:4px;padding:10px 13px;font-weight:950;box-shadow:3px 3px 0 rgba(25,26,21,.16);min-height:46px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(25,26,21,.16)}
.btn.primary{background:var(--pink);color:#fff}
.btn.accent{background:var(--blue);color:#fff}
.btn.danger{background:#f5d4df;color:#7d234b}
.btn.green{background:var(--green);color:#fff}
.btn.small{min-height:38px;padding:7px 10px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:9px}
.field{margin:13px 0}
.field label{display:block;font-weight:950;font-size:15px}
.field input,.field select{width:100%;margin-top:6px;border:2px solid var(--ink);background:#fffdf7;border-radius:3px;padding:11px 12px;outline:none}
.field input:focus,.field select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(192,72,143,.18)}
.empty{text-align:center;color:var(--muted);padding:22px}
.line{height:3px;background:var(--ink);margin:18px 0}
.tape{position:relative}
.tape:before{content:"";position:absolute;left:22%;top:-9px;width:110px;height:20px;background:rgba(242,223,0,.82);transform:rotate(-2deg);z-index:2}
.overlay{position:fixed;inset:0;z-index:100;background:rgba(25,26,21,.66);display:none;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.modal{position:relative;width:min(820px,100%);max-height:94dvh;overflow:auto;background:var(--paper);border:3px solid var(--ink);padding:22px 20px 25px;box-shadow:12px 13px 0 rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}
.close{position:absolute;right:9px;top:9px;width:44px;height:40px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink);font-size:25px;font-weight:1000;line-height:1;border-radius:3px;z-index:4}
.badge{display:inline-block;background:var(--blue);color:#fff;border:2px solid var(--ink);padding:5px 9px;font-size:13px;font-weight:1000;letter-spacing:.06em}
.modal-title{font-size:34px;line-height:1.03;margin:10px 42px 12px 0}
.prompt{font-size:19px;font-weight:900;line-height:1.32;background:#f8e8ca;border:2px solid var(--line);padding:12px 13px;margin:12px 0}
.negative-prompt{font-size:20px;font-weight:950;line-height:1.3;background:#f5d7e4;border:3px solid var(--pink);padding:13px;border-radius:3px;margin:12px 0}
.reference-box{background:#fff0a8;border:3px solid var(--ink);padding:16px 15px;margin:14px 0;position:relative;box-shadow:4px 4px 0 rgba(25,26,21,.12)}
.reference-box:after{content:"REFERENCE";position:absolute;right:8px;top:-12px;background:var(--pink);color:#fff;border:2px solid var(--ink);padding:4px 8px;font-size:11px;font-weight:1000;transform:rotate(2deg)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.chip{background:#fffdf7;border:2px solid var(--ink);padding:8px 11px;font-size:20px;font-weight:1000;line-height:1}
.tool-strip{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.tool-pill{background:#fffdf7;border:2px solid var(--ink);padding:8px 10px;font-size:15px;font-weight:950}
.swatch{display:inline-block;width:17px;height:17px;border:2px solid var(--ink);vertical-align:-3px;margin-right:6px}
.master{min-height:calc(100dvh - 110px);display:grid;grid-template-rows:auto 1fr;gap:12px}
.master-head{background:var(--cream);border:3px solid var(--ink);box-shadow:var(--shadow);padding:30px 30px;min-height:190px;display:flex;align-items:center;justify-content:space-between;gap:18px;position:relative;overflow:hidden}
.master-head:after{content:"";position:absolute;right:-30px;bottom:-65px;width:180px;height:180px;border-radius:50%;background:var(--blue);opacity:.95}
.master-kicker{font-size:13px;font-weight:1000;letter-spacing:.13em;color:var(--pink-dark)}
.master-head h1{font-size:clamp(46px,5.6vw,68px);margin:4px 0 0;position:relative;z-index:1}
.master-head p{margin:7px 0 0;font-size:18px;font-weight:800;position:relative;z-index:1}
.master-name{display:none}
.master-board{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);padding:16px 18px;display:grid;grid-template-rows:auto auto 1fr auto;gap:12px;min-height:0}
.master-status{display:grid;grid-template-columns:1.3fr .7fr .7fr;gap:10px;align-items:stretch}
.master-main-stat,.master-stat.candidate-stat,.master-stat.eliminated-stat{background:var(--cream);border:3px solid var(--ink);padding:12px 14px;box-shadow:5px 6px 0 rgba(25,26,21,.13)}
.master-main-stat strong{font-size:48px;line-height:1;display:block}
.master-main-stat span{font-size:15px;font-weight:950}
.master-stat{background:var(--cream);border:3px solid var(--ink);padding:11px 12px}
.master-stat strong{font-size:48px;line-height:1;display:block}
.master-stat span{font-size:15px;font-weight:950;color:var(--muted)}
.master-progress{height:30px;border:2px solid var(--ink);margin-top:18px;background:#e3d4b5;display:flex;overflow:hidden}
.master-progress i{height:100%;background:var(--pink);display:block}
.master-progress-label{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:1000;margin-top:5px}
.clue-dots{display:none}
.clue-dot{height:45px;background:#fffdf7;border:2px solid var(--ink);display:grid;place-items:center;font-weight:1000;font-size:17px}
.clue-dot.done{background:#e4eee5;color:#365a40;border-color:#668b6f;box-shadow:inset 0 0 0 2px #c8d9ca}
.master-bottom{display:flex;justify-content:center;align-items:center;gap:10px;border-top:3px solid var(--ink);padding-top:13px}
.master-bottom .note{font-size:18px;font-weight:950;color:var(--muted);text-align:center}
.master-bottom .actions{display:none}
.setup-wrap{max-width:800px;margin:auto}
.setup-paper{background:var(--cream);border:3px solid var(--ink);box-shadow:var(--shadow);padding:25px}
.setup-title{text-align:center}
.setup-title .mark{margin:0 auto 16px}
.setup-title h1{font-size:54px}
.chapter-list{display:grid;gap:7px;margin-top:10px}
.finding-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fffdf7;border:2px solid var(--line);padding:9px 10px}
.screen-heading{background:var(--cream);border:3px solid var(--ink);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:12px}.clue-toolbar{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:0}
.clue-toolbar h1{font-size:42px;margin:0}
.clue-toolbar .sub{margin:4px 0 0}
.toolbar-group{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.toolbar-group .btn{font-size:15px}
.toolbar-group .active{background:var(--blue);color:#fff}
.category-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.category-tabs::-webkit-scrollbar{display:none}
.category-tabs .btn{white-space:nowrap;font-size:15px}
.category-tabs .active{background:var(--pink);color:#fff}
.progress-line{height:12px;background:#dfcfad;border:2px solid var(--ink);margin-bottom:11px}
.progress-line i{display:block;height:100%;background:var(--pink)}
.clue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.clue-card{background:var(--cream);border:3px solid var(--ink);padding:12px 13px;display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;box-shadow:4px 5px 0 rgba(25,26,21,.13)}
.clue-card.done{background:var(--green-soft);border-color:var(--green);box-shadow:4px 5px 0 rgba(78,149,106,.16)}
.clue-card.done .clue-title-big{color:#58705f}
.clue-num{width:46px;height:46px;background:var(--ink);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-size:21px;font-weight:1000}
.clue-card.done .clue-num{background:var(--green);border-color:var(--green)}
.clue-title-big{font-size:19px;font-weight:1000;line-height:1.13}
.clue-cat{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-top:5px}
.clue-status{font-size:13px;color:var(--green);font-weight:1000;margin-top:4px}
.clue-card .actions{justify-content:flex-end}
.clue-card .btn{font-size:14px;padding:8px 9px;min-height:40px}
.page-choice-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.page-choice{min-height:52px!important;font-size:20px!important;font-weight:1000!important;background:#fffdf7!important}
.page-choice.selected{background:#d8e8dc!important;border-color:var(--green)!important;box-shadow:inset 0 0 0 3px var(--green)}.selection-feedback{margin-top:10px;background:var(--green-soft);border:2px solid var(--green);padding:9px 11px;font-weight:950}.selected-page-list{margin-top:10px;background:#f6ead4;border:2px solid var(--line);padding:10px}.selected-page-list h3{margin:0 0 6px;font-size:17px}.selected-page-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffdf7;border:1px solid var(--line);padding:7px 9px;margin-top:6px;font-weight:950}.selected-page-list:empty{display:none}.selected-page-row .remove-page{width:32px;height:32px;min-height:32px;padding:0;border:2px solid var(--ink);background:#f5d4df;color:#7d234b;font-weight:1000;line-height:1}
.range-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.range-grid .btn{font-size:16px}
.saved-inputs{background:#f6ead4;border:2px solid var(--line);padding:11px;margin-top:11px}
.saved-inputs h3{font-size:17px;margin:0 0 7px}
.saved-row{display:flex;justify-content:space-between;align-items:center;gap:9px;background:#fffdf7;border:1px solid var(--line);padding:8px;margin-top:6px;font-size:15px}
.saved-row .btn{min-height:35px;padding:6px 9px;font-size:13px}
.suspect-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.suspect-card{background:var(--paper);border:3px solid var(--ink);padding:16px;box-shadow:var(--shadow)}
.name-result{background:#fffdf7;border:2px solid var(--ink);padding:12px;margin-top:8px}
.eliminated-name{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--pink);background:#f8e5ed;padding:10px;margin-top:7px}
.potential-name{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--blue);background:#eef0f8;padding:10px;margin-top:7px}
.verify-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fffdf7;border:2px solid var(--line);padding:10px;margin-top:7px}
.verify-row small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.verify-result{padding:13px;border:3px solid var(--green);background:var(--green-soft);margin-top:12px}
.marker-callout{display:flex;align-items:center;gap:9px;background:#fff0a8;border:2px solid var(--ink);padding:9px;font-weight:950}
.marker-dot{width:24px;height:24px;border:2px solid var(--ink);flex:0 0 auto}
.archive-header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
.archive-header h1{font-size:42px;margin:0}
.archive-filters{display:grid;grid-template-columns:1fr 180px auto;gap:8px;background:var(--cream);border:3px solid var(--ink);padding:11px;margin-bottom:11px}
.archive-filters select,.archive-filters input{border:2px solid var(--ink);background:#fffdf7;padding:9px;border-radius:3px;font-weight:850}
.history-card{background:var(--paper);border:2px solid var(--ink);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:7px}
.history-card.undone{opacity:.52}
.history-meta{font-size:12px;color:var(--muted);font-weight:900}
.history-label{font-size:17px;font-weight:1000;margin-top:2px}
.history-data{font-size:14px;margin-top:3px}
.history-actions{display:flex;gap:6px;align-items:center}
.history-actions .btn{font-size:13px;min-height:36px;padding:6px 9px}
.case-closed{background:var(--cream);border:4px solid var(--ink);box-shadow:12px 12px 0 var(--pink);padding:28px;text-align:center}
.case-closed h2{font-size:54px;margin:5px 0 15px}
.celebrate{font-size:64px;letter-spacing:.08em;color:var(--pink);font-weight:1000;line-height:1}
@media(max-width:900px){
  .master{min-height:0}
  .master-status{grid-template-columns:1fr 1fr 1fr}
  .clue-grid{grid-template-columns:1fr}
  .suspect-grid{grid-template-columns:1fr}
}
@media(max-width:700px){
  html,body{font-size:17px}
  main{padding:12px 10px 28px}
  .bar{padding:13px 10px 9px}
  .brand b{font-size:22px}
  .brand small{font-size:13px}
  .solver-chip{font-size:12px;padding:6px 8px}
  nav{padding:0 8px 7px}
  nav button{font-size:16px;padding:8px 11px;min-height:44px}
  .master-head{display:block;padding:20px 16px;min-height:136px}
  .master-head h1{font-size:40px}
  .master-name{display:inline-block;margin-top:8px}
  .master-head:after{display:none}
  .master-status{grid-template-columns:1fr 1fr}
  .master-main-stat{grid-column:span 2}
  .clue-dots{grid-template-columns:repeat(6,1fr)}
  .master-bottom{display:block}
  .master-bottom .actions{margin-top:9px;justify-content:flex-start}
  .clue-card{grid-template-columns:45px 1fr}
  .clue-card .actions{grid-column:1 / -1;justify-content:stretch}
  .clue-card .actions .btn{flex:1}
  .archive-filters{grid-template-columns:1fr}
  .history-card{grid-template-columns:1fr}
  .history-actions{justify-content:flex-start}
  .page-choice-grid{grid-template-columns:repeat(3,1fr)}
  .range-grid{grid-template-columns:repeat(2,1fr)}
  .modal{padding:19px 14px 22px}
  .modal-title{font-size:29px}
}
</style>

function eliminateSuspectPage(clueNo,p){
  const before=snapshot(db.findings);
  if(!db.findings.some(x=>x.clue===clueNo&&x.page===p&&x.type==="elim"))db.findings.push({clue:clueNo,page:p,type:"elim"});
  const after=snapshot(db.findings);recordHistory(clueNo,"Page eliminated after suspect check","findings",before,after);save();closeModal();render("suspect");
}
function keepPotentialAfterFailure(encoded,p){
  const name=decodeURIComponent(encoded);
  const exists=db.potentialKillers.some(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!exists){const before=snapshot(db.potentialKillers);db.potentialKillers.push({name:name,page:p});recordHistory(0,"Potential Killer kept after failed check","potentialKillers",before,db.potentialKillers);}
  save();closeModal();render("suspect");
}
function markPotentialKiller(encoded,p){
  const name=decodeURIComponent(encoded),exists=db.potentialKillers.some(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!exists){
    const before=snapshot(db.potentialKillers);db.potentialKillers.push({name:name,page:p});recordHistory(0,"Potential Killer added","potentialKillers",before,db.potentialKillers);
  }
  db.eliminatedNames=db.eliminatedNames.filter(x=>x.name.toLowerCase()!==name.toLowerCase());
  save();
  openModal('<button class="close" onclick="closeModal()">×</button><span class="badge">POTENTIAL KILLER</span><h2 class="modal-title">'+esc(name)+'</h2><div class="prompt">Saved as a Potential Killer. This is not the final decision.</div><div class="actions"><button class="btn primary" onclick="closeModal();render(\'suspect\')">Stay on Suspect Verification</button><button class="btn accent" onclick="closeModal();openClue(18)">Go to Clue 18</button></div>');
}
function removePotential(i){
  const before=snapshot(db.potentialKillers);if(i>=0)db.potentialKillers.splice(i,1);
  const after=snapshot(db.potentialKillers);recordHistory(0,"Potential Killer removed","potentialKillers",before,after);save();render("suspect");
}
function clearPotentials(){
  openModal('<button class="close" onclick="closeModal()">×</button><span class="badge">CLEAR LIST</span><h2 class="modal-title">Clear all Potential Killers?</h2><p class="sub">This removes every saved potential from the list.</p><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="clearPotentialsNow()">Clear All</button></div>');
}
function clearPotentialsNow(){
  const before=snapshot(db.potentialKillers);db.potentialKillers=[];recordHistory(0,"All Potential Killers cleared","potentialKillers",before,[]);save();closeModal();render("suspect");
}
function restoreEliminatedName(i){
  const before=snapshot(db.eliminatedNames);if(i>=0)db.eliminatedNames.splice(i,1);
  const after=snapshot(db.eliminatedNames);recordHistory(0,"Eliminated name restored","eliminatedNames",before,after);save();render("suspect");
}
function completePage(p){
  const before=snapshot(db.findings);if(!db.findings.some(x=>x.clue===0&&x.page===p))db.findings.push({clue:0,page:p,type:"elim"});const after=snapshot(db.findings);recordHistory(0,"Page eliminated","findings",before,after);save();
}
function historyTypeMatch(h,type){
  if(type==="all")return true;
  if(type==="eliminatedNames")return h.key==="eliminatedNames";
  if(type==="potentialKillers")return h.key==="potentialKillers";
  if(type==="clues")return h.key==="clues";
  if(type==="final")return h.key==="final";
  if(type==="page")return h.key==="findings"&&[...(h.before||[]),...(h.after||[])].some(x=>x.page!=null);
  if(type==="chapter")return h.key==="findings"&&[...(h.before||[]),...(h.after||[])].some(x=>x.chapter!=null);
  return false;
}
function archive(){
  const list=db.history||[],type=window.archiveType||"all",clue=window.archiveClue||"";
  const filtered=list.filter(h=>historyTypeMatch(h,type)&&(clue===""||String(h.clue)===String(clue)));
  const clueOptions=clues.map(x=>'<option value="'+x[0]+'" '+(String(clue)===String(x[0])?"selected":"")+'>Clue '+x[0]+'</option>').join("");
  return '<div><div class="screen-heading"><div class="archive-header"><div><h1>INPUT ARCHIVE</h1><p class="sub">Filter by input type or clue number. Edit a recorded action.</p></div><b>'+filtered.length+' shown</b></div></div><div class="archive-filters"><select onchange="window.archiveType=this.value;render(\'archive\')"><option value="all">All input types</option><option value="page" '+(type==="page"?"selected":"")+'>Page eliminations</option><option value="chapter" '+(type==="chapter"?"selected":"")+'>Chapter exclusions</option><option value="eliminatedNames" '+(type==="eliminatedNames"?"selected":"")+'>Name eliminations</option><option value="potentialKillers" '+(type==="potentialKillers"?"selected":"")+'>Potential Killers</option><option value="clues" '+(type==="clues"?"selected":"")+'>Clue completion</option><option value="final" '+(type==="final"?"selected":"")+'>Final decision</option></select><select onchange="window.archiveClue=this.value;render(\'archive\')"><option value="">All clues</option>'+clueOptions+'</select><button class="btn" onclick="window.archiveType=\'all\';window.archiveClue=\'\';render(\'archive\')">Clear Filters</button></div><div>'+(filtered.length?filtered.map(h=>historyCard(h)).join(""):'<div class="card"><h2>No matching inputs</h2><p class="sub">Try a different filter.</p></div>')+'</div></div>';
}
function historyCard(h){
  return '<div class="history-card '+(h.undone?"undone":"")+'"><div><div class="history-meta">Clue '+h.clue+' · '+new Date(h.createdAt).toLocaleString()+'</div><div class="history-label">'+esc(h.label)+'</div><div class="history-data">'+(h.undone?"UNDONE":historySummary(h))+'</div></div><div class="history-actions"><button class="btn" onclick="openClue('+h.clue+')">Edit</button>'+(h.undone?"":'<button class="btn accent" onclick="undoHistory(\''+h.id+'\')">Undo</button>')+'</div></div>';
}
function historySummary(h){
  if(h.key==="findings")return"Finding change";
  if(h.key==="eliminatedNames")return"Name list change";
  if(h.key==="potentialKillers")return"Potential Killer list change";
  if(h.key==="clues")return"Completion change";
  if(h.key==="final")return"Final decision";
  return"Recorded input";
}
function undoHistory(id){
  const h=db.history.find(x=>x.id===id);if(!h||h.undone)return;
  if(h.key==="findings"||h.key==="eliminatedNames"||h.key==="potentialKillers"){
    const key=h.key,cur=db[key]||[],before=h.before||[],after=h.after||[];
    const added=after.filter(x=>!before.some(y=>JSON.stringify(y)===JSON.stringify(x)));
    const removed=before.filter(x=>!after.some(y=>JSON.stringify(y)===JSON.stringify(x)));
    added.forEach(x=>{const i=cur.findIndex(y=>JSON.stringify(y)===JSON.stringify(x));if(i>=0)cur.splice(i,1)});
    removed.forEach(x=>{if(!cur.some(y=>JSON.stringify(y)===JSON.stringify(x)))cur.push(snapshot(x))});
    db[key]=cur;
  }else if(h.key==="clues"){
    const key=h.clue;
    if(h.before&&h.before[key])db.clues[key]=snapshot(h.before[key]);else delete db.clues[key];
  }else if(h.key==="final"){db.final=snapshot(h.before)}
  h.undone=true;save();render("archive");
}
function openArchiveForClue(n){window.archiveClue=String(n);window.archiveType="all";go("archive")}
function openModal(html){$("modal").innerHTML=html;$("overlay").classList.add("open")}
function closeModal(){$("overlay").classList.remove("open")}
document.addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
const start=currentRoute();render(start);
</script>
</body></html>
