<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#243047">
<link rel="manifest" href="manifest.webmanifest">
<title>The Killer Isn't Alice — Case Board</title>
<style>:root{--pink:#e51b78;--cream:#f6e7c8;--paper:#fff7e7;--ink:#171717;--blue:#6570c7;--yellow:#f4dc00;--muted:#6f665b;--line:#d8c7a7;--white:#fffdf8;--shadow:0 10px 0 rgba(23,23,23,.08),0 18px 35px rgba(23,23,23,.12)}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}#app{min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--pink);color:#fff;box-shadow:0 4px 0 rgba(23,23,23,.12)}.bar{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:11px}.mark{width:43px;height:43px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:1000;font-size:16px;transform:rotate(-2deg);box-shadow:4px 4px 0 var(--yellow)}.brand b{font-weight:950;font-size:16px}.brand small{display:block;opacity:.8;font-size:11px}
nav{max-width:1120px;margin:auto;padding:0 12px 10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{border:2px solid transparent;background:transparent;color:#fff;border-radius:8px;padding:8px 11px;white-space:nowrap;font-weight:850}nav button.on{background:#fff;color:var(--pink);border-color:#fff}
main{max-width:1120px;margin:auto;padding:26px 16px 80px}h1,h2,h3{font-weight:950;letter-spacing:-.04em}h1{font-size:44px;line-height:.95;margin:0 0 9px}h2{font-size:28px;margin:8px 0}.sub{color:var(--muted);line-height:1.5;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{grid-column:span 12;background:var(--white);border:2px solid var(--ink);border-radius:4px;padding:18px;box-shadow:var(--shadow)}.half{grid-column:span 6}.third{grid-column:span 4}
.btn{border:2px solid var(--ink);background:var(--white);color:var(--ink);border-radius:6px;padding:10px 13px;font-weight:900;box-shadow:2px 3px 0 rgba(23,23,23,.14)}.btn:active{transform:translate(1px,2px);box-shadow:0 1px 0 rgba(23,23,23,.14)}.primary{background:var(--pink);border-color:var(--pink);color:#fff}.accent{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#fff0f3;border-color:#9d203e;color:#9d203e}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.stat{background:#fff;border:1px solid var(--line);padding:13px;border-radius:3px}.stat strong{display:block;font-size:27px}.stat span{color:var(--muted);font-size:12px}.progress{height:10px;background:#ead9ba;overflow:hidden;border:1px solid var(--ink)}.progress i{display:block;height:100%;background:var(--pink)}
.pages{display:flex;gap:6px;flex-wrap:wrap;max-height:260px;overflow:auto}.page{border:1px solid var(--ink);background:#fff;border-radius:4px;padding:7px 9px;font-size:12px}.page.elim{background:#ffd9e7}
.clues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.clue{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:3px;padding:16px;box-shadow:6px 7px 0 rgba(23,23,23,.12);min-height:205px}.clue:nth-child(3n){transform:rotate(.35deg)}.clue:nth-child(3n+1){transform:rotate(-.25deg)}.clue:after{content:"";position:absolute;right:13px;top:-8px;width:70px;height:17px;background:rgba(244,220,0,.75);transform:rotate(2deg)}.num{width:43px;height:43px;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font-size:19px;font-weight:1000;margin-right:9px;vertical-align:middle}.badge{display:inline-block;font-size:10px;padding:5px 8px;background:var(--blue);color:#fff;border-radius:999px;font-weight:950;vertical-align:middle;letter-spacing:.05em}.clue-title{margin:12px 0 8px;font-size:17px;line-height:1.2;font-weight:950}.hintline{font-size:12px;color:var(--muted);line-height:1.45}
.tool-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.tool{border:2px solid var(--ink);background:#fff;padding:11px 10px;border-radius:3px}.tool b{font-size:12px;display:block;margin-bottom:4px}.tool span{font-size:11px;line-height:1.35;color:var(--muted)}
.refbox{background:#fff3a8;border:2px solid var(--ink);padding:12px 13px;margin:12px 0;position:relative}.refbox:before{content:"REFERENCE";position:absolute;right:8px;top:-9px;background:var(--pink);color:#fff;padding:3px 7px;font-size:9px;font-weight:950;transform:rotate(2deg)}.refnames{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.namechip{background:#fff;border:1px solid var(--ink);padding:4px 7px;font-size:11px;border-radius:3px;font-weight:750}
.field{margin:12px 0}.field label{font-size:12px;font-weight:900;display:block}.field input{width:100%;margin-top:6px;border:2px solid var(--ink);background:#fff;padding:11px;border-radius:3px;outline:none}.field input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(229,27,120,.14)}.finding{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;padding:9px;margin-top:7px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:25px}
.overlay{position:fixed;inset:0;background:rgba(23,23,23,.64);display:none;z-index:100;padding:12px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{position:relative;width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:3px;padding:21px 20px 24px;box-shadow:12px 13px 0 rgba(0,0,0,.25);-webkit-overflow-scrolling:touch}.close{position:absolute;right:10px;top:10px;width:42px;height:42px;border:2px solid var(--ink);background:var(--yellow);font-size:25px;font-weight:1000;line-height:1;border-radius:3px;z-index:4}.line{height:2px;background:var(--ink);margin:17px 0}.setupHero{text-align:center;padding:32px 8px 18px}.setupHero .mark{margin:0 auto 17px}.setupHero h1{font-size:50px}.sticky{background:var(--yellow);border:2px solid var(--ink);padding:13px;transform:rotate(-.7deg);box-shadow:5px 6px 0 rgba(23,23,23,.12)}
@media(max-width:760px){.half,.third{grid-column:span 12}.clues{grid-template-columns:1fr}.tool-grid{grid-template-columns:1fr}main{padding:22px 12px 60px}h1{font-size:38px}.setupHero h1{font-size:40px}.modal{max-height:94vh;padding:19px 16px 22px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay"><div id="modal" class="modal"></div></div>
<script>
const KEY="tkia_pwa_v1";
const blank=()=>({setup:{first:null,last:null,chapters:{}},clues:{},findings:[],eliminatedNames:[],final:null});
let db=JSON.parse(localStorage.getItem(KEY)||"null")||blank();
const clues=[
[1,"The killer’s name is longer than three letters.","complete"],
[2,"The killer’s name does not start with an S.","complete"],
[3,"The killer’s name contains at least two vowels.","complete"],
[4,"The killer appears on a page with a repeated name.","eliminate"],
[5,"The killer’s name does not contain consecutive repeated letters.","complete"],
[6,"The killer’s page is between Anna’s page and Zack’s page.","annaZack"],
[7,"The killer’s name is not exactly six letters long.","complete"],
[8,"The killer’s name contains none of X, Y or Z.","complete"],
[9,"There is a three-letter name no more than ten names away from the killer.","eliminate"],
[10,"The first name in the main body of the killer’s page shares a letter with the killer.","eliminate"],
[11,"The killer’s page contains fewer than three names starting with M.","eliminate"],
[12,"There is a Kardashian within four pages of the killer.","source"],
[13,"The killer is not on a page with an even number of names.","eliminate"],
[14,"The page opposite the killer’s page contains a President first name.","eliminate"],
[15,"The killer appears in a chapter with a city in its title.","chapter"],
[16,"The killer’s page is no more than one page away from a Sasha.","source"],
[17,"The chapter containing the killer also contains all four Beatles.","chapter"],
[18,"The killer isn’t Alice.","final"]
];
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function pages(){if(!db.setup.first||!db.setup.last)return[];let a=Math.min(db.setup.first,db.setup.last),b=Math.max(db.setup.first,db.setup.last);return Array.from({length:b-a+1},(_,i)=>a+i)}
function status(p){let f=db.findings.filter(x=>x.page===p&&x.type==="elim");if(f.some(x=>x.clue===0))return"elim";if(f.length)return"elim";return db.setup.first?"work":"work"}
function render(route){if(!db.setup.first||!db.setup.last){route="setup"};document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.r===route));let a=$("app");a.innerHTML=header(route)+`<main>${route==="setup"?setup():route==="master"?master():route==="clues"?clueList():route==="inspector"?inspector():route==="suspect"?suspect():route==="refs"?refs():master()}</main>`;wire()}
function header(route){return `<div class="top"><div class="bar"><div class="brand"><div class="mark">A?</div><div><b>The Killer Isn’t Alice</b><small>Case Board</small></div></div></div><nav>${[["master","Master"],["clues","Clues"],["inspector","Page Inspector"],["suspect","Suspect Verification"],["refs","References"],["setup","Setup"]].map(x=>`<button type="button" data-r="${x[0]}" class="${route===x[0]?"on":""}">${x[1]}</button>`).join("")}</nav></div>`}
function wire(){
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.r;render(b.dataset.r)});
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>inspect(+b.dataset.page));
document.querySelectorAll("[data-open-clue]").forEach(b=>b.onclick=()=>openClue(+b.dataset.openClue));
document.querySelectorAll("[data-complete-clue]").forEach(b=>b.onclick=()=>complete(+b.dataset.completeClue));
}
function master(){let ps=pages(),elim=ps.filter(p=>status(p)==="elim").length,work=ps.length-elim;let done=Object.keys(db.clues).filter(k=>db.clues[k].done).length;return `<h1>Master</h1><p class="sub">Your case board. Everything here is derived from the findings you enter.</p><div class="grid"><div class="card half"><div class="row"><b>Clue progress</b><span>${done}/18</span></div><div class="progress" style="margin-top:10px"><i style="width:${done/18*100}%"></i></div></div><div class="card half"><b>Current candidate pages</b><h2 style="margin-top:8px">${work?candidateRanges(ps.filter(p=>status(p)!=="elim")):"None"}</h2></div><div class="card third"><div class="stat"><strong>${work}</strong><span><i class="dot cand"></i>Candidate / needs work</span></div></div><div class="card third"><div class="stat"><strong>${elim}</strong><span><i class="dot elim"></i>Eliminated</span></div></div><div class="card third"><div class="stat"><strong>${Object.keys(db.setup.chapters).length}</strong><span>Chapters entered</span></div></div><div class="card"><div class="row"><b>Page map</b><button class="btn" onclick="location.hash='inspector';render('inspector')">Page Inspector</button></div><div class="pages" style="margin-top:12px">${ps.map(p=>`<button type="button" class="page ${status(p)}" data-page="${p}">${p}</button>`).join("")||'<div class="empty">Set the book range in Setup.</div>'}</div></div></div>`}
function candidateRanges(a){if(!a.length)return"None";let out=[],s=a[0],p=a[0];for(let i=1;i<a.length;i++){if(a[i]===p+1)p=a[i];else{out.push(s===p?`${s}`:`${s}–${p}`);s=p=a[i]}}out.push(s===p?`${s}`:`${s}–${p}`);return out.join(", ")}
function setup(){return `<div class="setupHero"><div class="mark">A?</div><h1>Set up your case</h1><p class="sub">You only do this once. The app saves the case on this device and opens the Master next time.</p></div><div class="setupBox"><div class="card"><div class="field"><label>First page containing names</label><input id="first" type="number" value="${db.setup.first||""}"></div><div class="field"><label>Last page containing names</label><input id="last" type="number" value="${db.setup.last||""}"></div><div class="actions"><button class="btn primary" onclick="saveSetup()">Save & Open Master</button><button class="btn danger" onclick="resetCase()">Start a new case</button></div></div><div class="card" style="margin-top:12px"><h3>Chapters</h3><p class="sub">Add chapter ranges progressively when you need them. Chapter 15 uses the exact city-only wording for your edition.</p><button class="btn" onclick="addChapter()">+ Add chapter</button><div id="chapterRows">${Object.entries(db.setup.chapters).sort((a,b)=>+a[0]-+b[0]).map(([n,c])=>`<div class="finding"><span><b>Chapter ${n}</b> · ${esc(c.title||"")} · pp.${c.start}–${c.end}</span><button class="btn" onclick="delChapter(${n})">Delete</button></div>`).join("")}</div></div></div>`}
function saveSetup(){db.setup.first=+$("first").value;db.setup.last=+$("last").value;if(!db.setup.first||!db.setup.last)return;save();location.hash="master";render("master")}
function resetCase(){if(confirm("Start a new case and clear the current book data?")){db=blank();save();location.hash="setup";render("setup")}}
function addChapter(){open(`<h2>Add chapter</h2><div class="field"><label>Chapter number</label><input id="cn" type="number"></div><div class="field"><label>Chapter title</label><input id="ct"></div><div class="field"><label>Start page</label><input id="cs" type="number"></div><div class="field"><label>End page</label><input id="ce" type="number"></div><div class="actions"><button class="btn primary" onclick="saveChapter()">Save</button></div>`)}
function saveChapter(){let n=+$("cn").value,s=+$("cs").value,e=+$("ce").value;if(!n||!s||!e)return;db.setup.chapters[n]={title:$("ct").value,start:s,end:e};save();closeModal();render("setup")}
function delChapter(n){delete db.setup.chapters[n];save();render("setup")}
function clueList(){
let done=Object.keys(db.clues).filter(k=>db.clues[k].done).length;
return `<div class="sticky" style="margin-bottom:19px"><b style="font-size:12px">CASE FILE · ALICE STARLING</b><div style="font-size:29px;font-weight:1000;margin-top:3px">18 CLUES. ONE KILLER.</div><div style="font-size:12px;margin-top:3px">Work through the evidence and cross out the innocent.</div></div>
<h1>Clues</h1><p class="sub">Each clue has its own evidence notes, required references, and the exact data you need to record.</p>
<div class="card" style="margin-bottom:18px;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:7px 8px 0 var(--pink)">
<div class="row"><div><b>CASE PROGRESS</b><div style="font-size:12px;opacity:.75;margin-top:3px">Completed clues</div></div><strong style="font-size:28px">${done}/18</strong></div>
<div class="progress" style="margin-top:11px;background:#4a4a4a;border-color:#fff"><i style="width:${done/18*100}%"></i></div></div>
<div class="clues">${clues.map(c=>{
let mode=c[2],tag=mode==="complete"?"VERIFY":mode==="eliminate"?"FILTER":mode==="source"?"SEARCH":mode==="chapter"?"CHAPTER":"FINAL";
let action=mode==="eliminate"?"Filter pages":mode==="source"?"Find reference pages":mode==="chapter"?"Check chapter":mode==="annaZack"?"Find Anna + Zack":mode==="final"?"Submit final deduction":"Verify the name";
return `<article class="clue"><span class="num">${c[0]}</span><span class="badge">${tag}</span>
<div class="clue-title">${esc(c[1])}</div><div class="hintline">${action} · the button opens the complete clue sheet.</div>
<div class="actions"><button type="button" class="btn primary" data-open-clue="${c[0]}">Open clue sheet</button>${mode==="complete"?`<button type="button" class="btn" data-complete-clue="${c[0]}">${db.clues[c[0]]?.done?"✓ Completed":"Mark complete"}</button>`:""}</div></article>`}).join("")}</div>`;
}
function complete(n){db.clues[n]={done:true};save();render("clues")}
const REFS={
vowels:["A","E","I","O","U"],
kardashians:["Kris","Kourtney","Kim","Khloé","Rob","Kendall","Kylie"],
presidents:["George","Thomas","John","James","Andrew","Martin","William","Zachary","Millard","Franklin","Abraham","Ulysses","Rutherford","Benjamin","Grover","Theodore","Woodrow","Warren","Calvin","Herbert","Harry","Dwight","Lyndon","Richard","Gerald","Jimmy","Ronald","Bill","Barack","Donald","Joe"],
beatles:["John","Paul","George","Ringo"]
};
function refBox(title,items,note=""){return `<div class="refbox"><b>${title}</b>${note?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${note}</div>`:""}<div class="refnames">${items.map(x=>`<span class="namechip">${esc(x)}</span>`).join("")}</div></div>`}
function clueClarification(n){const c={
1:"Only the name length matters. Three letters or fewer can be crossed out.",
2:"The initial letter must not be S.",
3:"Count A, E, I, O and U only. Y does not count. Repeated vowels count separately.",
4:"A repeated name means the exact same spelling appears at least twice on the same numbered page. Different spellings do not count.",
5:"Any consecutive repeated letter rules the name out, including repeated vowels.",
6:"There is one Anna and one Zack. Variants such as Zackary do not count. The killer's page is strictly between their pages.",
7:"This rules out names that are exactly six letters long. Longer names are not affected.",
8:"None of X, Y or Z may appear anywhere in the killer's name.",
9:"Read names in normal left-to-right reading order. The three-letter name can be on the previous or next page if it is within ten names.",
10:"Use the first name in the main body of the page. Ignore the book title and chapter title.",
11:"Count every M-starting name on the page, including duplicates. The page must contain fewer than three.",
12:"The killer's page itself counts. Check four pages on either side.",
13:"Count every name on the numbered page, including duplicates. Do not count the book title or chapter title.",
14:"Check the physical facing page. In the book layout, page 2 faces 3, page 4 faces 5, etc. The opposite page must contain a qualifying President first name.",
15:"For this updated edition, the clue is specifically about a city in the chapter title. Small towns, villages and states do not qualify.",
16:"The Sasha can be on the killer's page itself, or exactly one page before or after.",
17:"The chapter containing the killer must contain all four Beatles. A name can satisfy more than one clue.",
18:"This is the final tie-breaker and is relevant when only two suspects remain."
};return c[n]||"Use the book as the source of truth. This case board records your findings and keeps the investigation organized."}
function toolInfo(mode,n){
if(mode==="eliminate")return `<div class="tool-grid"><div class="tool"><b>🔎 PAGE INSPECTOR</b><span>Inspect a candidate page before crossing it out.</span></div><div class="tool"><b>✍️ RECORD PAGES</b><span>Enter every page that fails this clue.</span></div><div class="tool"><b>🚫 CASE BOARD</b><span>Recorded eliminated pages leave the candidate set.</span></div></div>`;
if(mode==="source")return `<div class="tool-grid"><div class="tool"><b>🔎 PAGE SEARCH</b><span>Find the named reference in the book.</span></div><div class="tool"><b>✍️ RECORD PAGES</b><span>Save the pages where the reference appears.</span></div><div class="tool"><b>📌 FINDINGS</b><span>Saved evidence remains attached to this clue.</span></div></div>`;
if(mode==="chapter")return `<div class="tool-grid"><div class="tool"><b>📖 CHAPTER CHECK</b><span>Enter chapter number, title and page range in Setup.</span></div><div class="tool"><b>✍️ RECORD CHAPTERS</b><span>Save qualifying chapters as evidence.</span></div><div class="tool"><b>📌 CASE BOARD</b><span>Use the chapter evidence with your remaining pages.</span></div></div>`;
if(mode==="annaZack")return `<div class="tool-grid"><div class="tool"><b>🔎 FIND NAMES</b><span>Locate the one Anna and one Zack.</span></div><div class="tool"><b>✍️ TWO PAGE FIELDS</b><span>Record both page numbers.</span></div><div class="tool"><b>↔ BETWEEN</b><span>The killer must be strictly between them.</span></div></div>`;
if(n===18)return `<div class="tool-grid"><div class="tool"><b>🧩 CASE BOARD</b><span>Use the remaining evidence before answering.</span></div><div class="tool"><b>✍️ FINAL NAME</b><span>Enter the suspect you have narrowed it down to.</span></div><div class="tool"><b>✓ VERIFY</b><span>Use the official solution checker if you want confirmation.</span></div></div>`;
return `<div class="tool-grid"><div class="tool"><b>📖 BOOK PASS</b><span>Check the clue directly against the page.</span></div><div class="tool"><b>✓ VERIFY</b><span>Mark the clue complete when your check is finished.</span></div><div class="tool"><b>🧭 MASTER</b><span>Return to the case board to see progress.</span></div></div>`;
}
function openClue(n){
let c=clues.find(x=>x[0]===n),body="";
if(c[2]==="eliminate")body=`<div class="field"><label>Pages that fail Clue ${n}</label><input id="nums" inputmode="numeric" placeholder="47, 52, 61"></div><button class="btn primary" onclick="addElims(${n})">Save eliminated pages</button>${listFind(n)}`;
else if(c[2]==="source")body=`<div class="field"><label>Pages containing the required reference</label><input id="nums" inputmode="numeric" placeholder="50, 73"></div><button class="btn primary" onclick="addSources(${n})">Save source pages</button>${listFind(n)}`;
else if(c[2]==="chapter")body=`<div class="field"><label>Qualifying chapter numbers</label><input id="nums" inputmode="numeric" placeholder="3, 8"></div><button class="btn primary" onclick="addChapters(${n})">Save chapters</button>${listFind(n)}`;
else if(n===6)body=`<div class="field"><label>Anna page</label><input id="anna" inputmode="numeric" type="number" value="${db.clues[6]?.anna||""}"></div><div class="field"><label>Zack page</label><input id="zack" inputmode="numeric" type="number" value="${db.clues[6]?.zack||""}"></div><button class="btn primary" onclick="saveAZ()">Save Anna / Zack</button>`;
else if(n===18)body=`<div class="field"><label>Final killer name</label><input id="killer" placeholder="Enter the name"></div><button class="btn accent" onclick="solve()">Close the case</button>`;
else body=`<button class="btn primary" onclick="complete(${n});closeModal();render('clues')">${db.clues[n]?.done?"✓ Marked complete":"Mark clue complete"}</button>`;
let refs="";
if(n===3)refs=refBox("VOWELS THAT COUNT",REFS.vowels,"Only these five letters count. Y does not.");
if(n===6)refs=refBox("NAMES TO FIND",["Anna","Zack"],"Only these exact spellings count.");
if(n===12)refs=refBox("KARDASHIAN NAMES",REFS.kardashians,"Use exact spellings.");
if(n===14)refs=refBox("PRESIDENT FIRST NAMES",REFS.presidents,"Only exact first names from this reference list count.");
if(n===16)refs=refBox("NAME TO FIND",["Sasha"],"Sasha on the killer's own page counts.");
if(n===17)refs=refBox("THE FOUR BEATLES",REFS.beatles,"All four must occur in the same chapter.");
if(n===4)refs=refBox("IMPORTANT SPELLING RULE",["Exact spelling"],"Kylie and Kylee, for example, are different names.");
if(n===9)refs=refBox("WHAT YOU ARE LOOKING FOR",["Any 3-letter name"],"The three-letter name may fall on an adjacent page if it is within ten names in reading order.");
if(n===10)refs=refBox("COMPARE",["First name on page","Killer's name"],"At least one letter must be shared.");
if(n===11)refs=refBox("COUNTING RULE",["M-starting names"],"Duplicates count.");
if(n===13)refs=refBox("COUNTING RULE",["All names on page"],"Duplicates count; ignore book/chapter titles.");
if(n===15)refs=refBox("CHAPTER RULE",["City in title"],"The updated edition's wording is city-specific.");
if(n===18)refs=refBox("FINAL RULE",["Alice"],"Use this only at the final two-suspect stage.");
openModal(`<button class="close" aria-label="Close" onclick="closeModal()">×</button><span class="badge">CLUE ${n}</span><h2>${esc(c[1])}</h2><div class="line"></div><div class="sticky"><b>WHAT TO PAY ATTENTION TO</b><div style="margin-top:5px;line-height:1.5">${esc(clueClarification(n))}</div></div>${refs}<h3 style="margin:18px 0 5px">Your tools</h3>${toolInfo(c[2],n)}<div class="line"></div>${body}`);
}
function parseNums(s){return(s||"").split(",").map(x=>+x.trim()).filter(Number.isFinite)}
function addElims(n){parseNums($("nums").value).forEach(p=>db.findings.push({clue:n,page:p,type:"elim"}));save();closeModal();render("clues")}
function addSources(n){parseNums($("nums").value).forEach(p=>db.findings.push({clue:n,page:p,type:"source"}));save();closeModal();render("clues")}
function addChapters(n){parseNums($("nums").value).forEach(ch=>db.findings.push({clue:n,chapter:ch,type:"chapter"}));save();closeModal();render("clues")}
function saveAZ(){db.clues[6]={anna:+$("anna").value,zack:+$("zack").value,done:!!+$("anna").value&&!!+$("zack").value};save();closeModal();render("clues")}
function listFind(n){let f=db.findings.filter(x=>x.clue===n);return `<div style="margin-top:15px"><b>Saved findings</b>${f.length?f.map((x,i)=>`<div class="finding"><span>${x.type==="chapter"?`Chapter ${x.chapter}`:`p.${x.page}`}</span><button class="btn" onclick="delFinding(${db.findings.indexOf(x)},${n})">Delete</button></div>`).join(""):"<div class='empty'>None.</div>"}</div>`}
function delFinding(i,n){db.findings.splice(i,1);save();openClue(n)}
function inspector(){return `<h1>Page Inspector</h1><p class="sub">Ask about one page at a time.</p><div class="card"><div class="field"><label>Page number</label><input id="ip" type="number" placeholder="57"></div><button class="btn primary" onclick="inspect(+$('ip').value)">Inspect</button></div>`}
function inspect(p){let f=db.findings.filter(x=>x.page===p&&x.type==="elim"),s=f.length?"elim":"work";open(`<button class="close" onclick="closeModal()">×</button><span class="badge">Page Inspector</span><h2>Page ${p}</h2><div class="stat"><strong><i class="dot ${s}"></i>${s==="elim"?"Eliminated":"Needs Work"}</strong></div><h3>Why</h3>${f.length?f.map(x=>`<div class="finding">Eliminated by Clue ${x.clue}</div>`).join(""):"<div class='empty'>No elimination finding recorded for this page.</div>"}<h3>Next</h3><div class="finding">Check unresolved clue conditions relevant to this page in the Clues tab.</div>`)}
function suspect(){return `<h1>Suspect Verification</h1><p class="sub">Check a specific name on a specific page. Failures can be written back to the same clue findings.</p><div class="card"><div class="field"><label>Suspect name</label><input id="sn"></div><div class="field"><label>Page</label><input id="sp" type="number"></div><button class="btn primary" onclick="checkSuspect()">Start verification</button></div><div class="card" style="margin-top:14px"><b>Previously eliminated names</b>${db.eliminatedNames.length?db.eliminatedNames.map((x,i)=>`<div class="finding"><span>${esc(x.name)}${x.page?` · p.${x.page}`:""}</span><button class="btn" onclick="db.eliminatedNames.splice(${i},1);save();render('suspect')">Delete</button></div>`).join(""):"<div class='empty'>None yet.</div>"}</div>`}
function checkSuspect(){let n=$("sn").value.trim(),p=+$("sp").value;if(!n||!p)return;open(`<button class="close" onclick="closeModal()">×</button><span class="badge">Suspect Verification</span><h2>${esc(n)} · p.${p}</h2><p class="sub">Choose a clue to test. The failure is recorded against the page, not just the name.</p>${[4,9,10,11,13,14].map(c=>`<div class="finding"><span><b>Clue ${c}</b> · ${esc(clues[c-1][1])}</span><button class="btn" onclick="failSuspect(${c},${p},'${encodeURIComponent(n)}')">Fails</button></div>`).join("")}<div class="actions"><button class="btn danger" onclick="eliminateName('${encodeURIComponent(n)}',${p})">Record name as eliminated</button></div>`)}
function failSuspect(c,p,n){db.findings.push({clue:c,page:p,type:"elim"});let name=decodeURIComponent(n);if(!db.eliminatedNames.some(x=>x.name.toLowerCase()===name.toLowerCase()))db.eliminatedNames.push({name,page:p});save();open(`<button class="close" onclick="closeModal()">×</button><h2>Suspect eliminated</h2><p>${esc(name)} fails Clue ${c} on p.${p}.</p><h3>Any other potential killer names on this page?</h3><div class="actions"><button class="btn primary" onclick="closeModal()">Yes — keep page open</button><button class="btn danger" onclick="completePage(${p})">No — eliminate page completely</button></div>`)}
function eliminateName(n,p){let name=decodeURIComponent(n);if(!db.eliminatedNames.some(x=>x.name.toLowerCase()===name.toLowerCase()))db.eliminatedNames.push({name,page:p});save();closeModal()}
function completePage(p){db.findings.push({clue:0,page:p,type:"elim"});save();closeModal();render("master")}
function refs(){return `<h1>References</h1><p class="sub">Exact reference lists used by the clue workflow.</p><div class="grid"><div class="card half"><h3>Kardashians</h3><p>Kris · Kourtney · Kim · Khloé · Rob · Kendall · Kylie</p></div><div class="card half"><h3>Beatles</h3><p>John · Paul · George · Ringo</p></div><div class="card"><h3>Vowels</h3><p>A · E · I · O · U. Y is not a vowel. Duplicate vowels count.</p></div><div class="card"><h3>Edition-specific Clue 15</h3><p>The killer appears in a chapter with a city in its title.</p></div></div>`}
function solve(){let n=$("killer").value.trim();if(!n)return;db.final={name:n};save();closeModal();$("app").innerHTML=`<main class="final"><div><div class="seal">CASE<br>CLOSED</div><h1>YOU SOLVED IT</h1><div class="name">${esc(n)}</div><p class="sub">The case is officially closed.</p><button class="btn" onclick="db.final=null;save();render('master')">Back to case</button></div></main>`}
function open(html){$("modal").innerHTML=html;$("overlay").classList.add("open")}
function closeModal(){$("overlay").classList.remove("open")}
const start=location.hash.slice(1)||(!db.setup.first?"setup":"master");render(start);
</script>
</body></html>
