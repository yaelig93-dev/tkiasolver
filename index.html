[1,"The killer’s name is longer than three letters.","complete"],
[2,"The killer’s name does not start with an S.","complete"],
[3,"The killer’s name contains at least two vowels.","complete"],
[4,"The killer appears on a page with a repeated name.","eliminate"],
[5,"The killer’s name does not contain consecutive repeated letters.","complete"],

[13,"The killer is not on a page with an even number of names.","eliminate"],

function pages(){if(!db.setup.first||!db.setup.last)return[];let a=Math.min(db.setup.first,db.setup.last),b=Math.max(db.setup.first,db.setup.last);return Array.from({length:b-a+1},(_,i)=>a+i)}

function render(route){if(!db.setup.first||!db.setup.last){route="setup"};document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.r===route));let a=$("app");a.innerHTML=header(route)+`<main>${route==="setup"?setup():route==="master"?master():route==="clues"?clueList():route==="inspector"?inspector():route==="suspect"?suspect():route==="archive"?archive():route==="refs"?refs():master()}</main>`;wire()}

function wire(){
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.r;render(b.dataset.r)});

}

 if(e.target.id==="overlay")closeModal();

oin("")+'</div></section><section class="master-panel"><h2>QUICK ACTIONS</h2><div class="master-actions"><button class="btn primary" onclick="location.hash=\'clues\';render(\'clues\')">Open clues</button><button class="btn" onclick="location.hash=\'archive\';render(\'archive\')">Open input archive</button><button class="btn" onclick="location.hash=\'suspect\';render(\'suspect\')">Suspect verification</button><button class="btn" onclick="location.hash=\'refs\';render(\'refs\')">Reference lists</button></div><div style="margin-top:14px"><h3>CHAPTERS ENTERED</h3><div class="chapter-mini">'+(chapters.length?chapters.map(function(x){return '<div class="chapter"><b>Ch. '+x[0]+'</b>'+esc(x[1].title||"")+'</div>'}).join(""):'<div class="chapter">No chapters entered yet.</div>')+'</div></div></section></div><div class="master-footer"><div><b>Potential killer:</b> '+(db.potentialKiller?esc(db.potentialKiller.name)+" · p."+db.potentialKiller.page:"Not set yet")+' <span style="margin-left:10px">Final decision is made only in Clue 18.</span></div><button class="btn accent" onclick="location.hash=\'clues\';render(\'clues\');setTimeout(function(){openClue(18)},50)">Go to Clue 18</button></div></div>'}
function setup(){return `<div class="setupHero"><div class="mark">A?</div><h1>Set up your case</h1><p class="sub">You only do this once. The app saves the case on this device and opens the Master next time.</p></div><div class="setupBox"><div class="card"><div class="field"><label>First page containing names</label><input id="first" type="number" value="${db.setup.first||""}"></div><div class="field"><label>Last page containing names</label><input id="last" type="number" value="${db.setup.last||""}"></div><div class="actions"><button class="btn primary" onclick="saveSetup()">Save & Open Master</button><button class="btn danger" onclick="resetCase()">Start a new case</button></div></div><div class="card" style="margin-top:12px"><h3>Chapters</h3><p class="sub">Add chapter ranges progressively when you need them. Chapter 15 uses the exact city-only wording for your edition.</p><button class="btn" onclick="addChapter()">+ Add chapter</button><div id="chapterRows">${Object.entries(db.setup.chapters).sort((a,b)=>+a[0]-+b[0]).map(([n,c])=>`<div class="finding"><span><b>Chapter ${n}</b> · ${esc(c.title||"")} · pp.${c.start}–${c.end}</span><button class="btn" onclick="delChapter(${n})">Delete</button></div>`).join("")}</div></div></div>`}

function openModal(html){open(html)}
function closeModal(){$("overlay").classList.remove("open")}

function snapshot(v){return JSON.parse(JSON.stringify(v))}
function recordHistory(clue,label,key,before,after){db.history=db.history||[];db.history.unshift({id:Date.now()+"_"+Math.random().toString(36).slice(2),clue:clue,label:label,key:key,before:snapshot(before),after:snapshot(after),createdAt:new Date().toISOString(),undone:false});db.history=db.history.slice(0,120)}
function toggleComplete(n){var before=snapshot(db.clues);delete db.clues[n];var after=snapshot(db.clues);recordHistory(n,"Completion undone","clues",before,after);save();render("clues")}
function openArchiveForClue(n){location.hash="archive";render("archive");setTimeout(function(){var e=document.getElementById("history-"+n);if(e)e.scrollIntoView({block:"start"})},50)}
function undoHistory(id){var h=db.history.find(function(x){return x.id===id});if(!h||h.undone)return;db[h.key]=snapshot(h.before);h.undone=true;save();render("archive")}
function historySummary(h){if(h.key==="findings"){var a=h.after||[],b=h.before||[];if(a.length>b.length)return"Finding added";if(a.length<b.length)return"Finding removed";return"Findings updated"}if(h.key==="clues")return"Completion state changed";if(h.key==="potentialKiller")return h.after?"Potential killer saved":"Potential killer cleared";return"Input saved"}
function archive(){var list=db.history||[];return '<div class="archive-screen"><div class="archive-header"><div><h1>Input Archive</h1><p class="sub">Every saved decision is recorded here. Undo an input or jump back to its clue.</p></div><div style="font-size:22px;font-weight:1000">'+list.length+' inputs</div></div><div class="archive-list">'+(list.length?list.map(function(h){return '<div class="history-card '+(h.undone?"undone":"")+'" id="history-'+h.clue+'"><div><div class="history-meta">Clue '+h.clue+' · '+new Date(h.createdAt).toLocaleString()+'</div><div class="history-label">'+esc(h.label)+'</div><div class="history-data">'+(h.undone?"UNDONE":historySummary(h))+'</div></div><div class="history-actions"><button class="btn" onclick="openClue('+h.clue+')">Edit</button>'+(h.undone?"":'<button class="btn accent" onclick="undoHistory(\''+h.id+'\')">Undo</button>')+'</div></div>'}).join(""):'<div class="card"><h2>No inputs yet</h2><p class="sub">Every input will appear here.</p></div>')+'</div></div>'}

const start=location.hash.slice(1)||(!db.setup.first?"setup":"master");render(start);
</script>
</body></html>
function deleteFinding(n,i){var before=snapshot(db.findings);if(i>=0)db.findings.splice(i,1);var after=snapshot(db.findings);recordHistory(n,"Input removed","findings",before,after);save();openClue(n)}
